
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Вход | CYBERARENA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f1829;
            color: #f3f5fa;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
        }
        main { width: min(460px, 90%); padding: 38px; background:#17243a; border:1px solid #31415d; border-radius:20px; }
        h1 { font-size:34px; margin-bottom:6px; } p { color:#aab7cd; }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            padding: 12px;
            color: white;
            background: #1e2d46;
            border: 1px solid #31415d;
            border-radius: 11px;
        }
        button {
            padding: 12px;
            background: #8f83f3;
            color:white;
            border: none;
            border-radius: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .error { color: #ff7777; }
        a { color: #b9b9ff; }
    </style>
</head>
<body>
    <main>
        <h1>CYBERARENA</h1>
        <p>Вход в аккаунт</p>

        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form action="/login" method="post">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">Логин</label>
            <input
                id="username"
                name="username"
                value="{{ username }}"
                autocomplete="username"
                required
            >

            <label for="password">Пароль</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Войти</button>
        </form>

        <p>Нет аккаунта? <a href="/register">Регистрация</a></p>
        <p><a href="/">На главную</a></p>
    </main>
</body>
</html>
