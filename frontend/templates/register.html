
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | CYBERARENA</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111114;
            color: #f5f5f5;
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(400px, 90%);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label { font-size: 14px; }

        input {
            padding: 12px;
            background: #202024;
            border: 1px solid #45454c;
            border-radius: 6px;
            color: white;
        }

        button {
            padding: 12px;
            margin-top: 8px;
            background: #a2ff85;
            border: 0;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .error { color: #ff7777; }
        .success { color: #a2ff85; }
        a { color: #a2ff85; }
    </style>
</head>
<body>
    <main>
        <h1>CYBERARENA</h1>
        <p>Создание аккаунта</p>

        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success" role="status">{{ success }}</p>
        {% endif %}

        <form method="post" action="/register">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">Логин</label>
            <input
                id="username"
                name="username"
                value="{{ username }}"
                minlength="3"
                maxlength="32"
                autocomplete="username"
                required
            >

            <label for="password">Пароль</label>
            <input
                id="password"
                type="password"
                name="password"
                minlength="12"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="password_confirm">Повтор пароля</label>
            <input
                id="password_confirm"
                type="password"
                name="password_confirm"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Зарегистрироваться
            </button>
        </form>

        <p><a href="/">Вернуться на главную</a></p>
    </main>
</body>
</html>
