<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CYBERARENA{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#0f1829;--surface:#17243a;--surface-2:#1e2d46;--line:#31415d;--text:#f3f5fa;--muted:#aab7cd;--accent:#8f83f3;--accent-2:#b9b9ff;--ok:#52d6a3;--warn:#f2c14e;--danger:#ff887f;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,sans-serif}a{color:var(--accent-2);text-decoration:none}a:hover{text-decoration:underline}.shell{width:min(1180px,calc(100% - 40px));margin:auto}.site-header{position:sticky;top:0;z-index:10;background:rgba(15,24,41,.96);border-bottom:1px solid var(--line)}nav{min-height:76px;display:flex;align-items:center;gap:30px}.brand{display:flex;align-items:center;gap:11px;color:var(--text);font-weight:800;letter-spacing:.02em;margin-right:auto}.brand-mark{width:28px;height:28px;background:var(--accent);transform:rotate(45deg);border-radius:7px;display:inline-block}.nav-links{display:flex;align-items:center;gap:22px}.nav-links>a{color:var(--muted)}.nav-links>a:hover{color:var(--text);text-decoration:none}.nav-form{display:inline;margin:0}.nav-button,.button,button{border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:11px 18px;cursor:pointer}.nav-button{background:transparent;color:var(--muted);padding:0}.button{display:inline-flex;align-items:center;justify-content:center}.button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}main{padding:54px 0 80px}h1,h2,h3{font-family:Manrope,Inter,system-ui,sans-serif;line-height:1.15;margin-top:0}h1{font-size:clamp(34px,5vw,56px)}h2{font-size:26px}.eyebrow{color:var(--accent-2);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:13px}.lead{font-size:19px;color:var(--muted);max-width:680px}.grid{display:grid;gap:20px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card,article{padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:18px 0}.card-accent{position:relative;overflow:hidden}.card-accent:before{content:"";position:absolute;left:24px;top:0;width:72px;height:5px;border-radius:0 0 5px 5px;background:var(--accent)}.meta,.muted,small{color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:7px;color:var(--accent-2);background:rgba(143,131,243,.12);border:1px solid rgba(143,131,243,.3);padding:5px 10px;border-radius:999px;font-size:13px}.tag.ok{color:var(--ok);background:rgba(82,214,163,.1);border-color:rgba(82,214,163,.28)}input,textarea,select,button{font:inherit;max-width:100%;box-sizing:border-box}input,textarea,select{width:100%;padding:12px 14px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(143,131,243,.16)}textarea{min-height:160px}label{display:block;margin:14px 0;color:var(--muted)}.message{border:1px solid rgba(82,214,163,.35);background:rgba(82,214,163,.08);border-radius:12px;padding:14px}.error{color:var(--danger)}.description{white-space:pre-wrap;overflow-wrap:anywhere}.scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid var(--line);padding:15px 18px}th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}tbody tr:last-child td{border-bottom:0}.danger{border-color:rgba(255,136,127,.5)}.pagination{display:flex;gap:24px;margin:24px 0}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:42px;align-items:center;min-height:500px}.hero-visual{position:relative;min-height:320px;border:1px solid var(--line);border-radius:24px;background:var(--surface);display:grid;place-items:center}.code-tile{font:700 64px/1 JetBrains Mono,monospace;color:var(--accent-2);background:var(--surface-2);padding:54px 48px;border-radius:22px}.dots{position:absolute;right:28px;top:28px;color:var(--accent);letter-spacing:8px}.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{padding:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.feature b{display:block;color:var(--accent-2);font-size:20px}.challenge-card{display:flex;flex-direction:column;min-height:270px}.challenge-card h2{font-size:23px;margin:18px 0 10px}.challenge-card .button{margin-top:auto}.challenge-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:24px}.auth-layout{display:grid;grid-template-columns:1fr 535px;gap:56px;align-items:center;min-height:calc(100vh - 190px)}.auth-card{padding:38px}.auth-card h1{font-size:36px}.auth-visual{padding:34px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}.auth-visual .code-tile{display:inline-block;font-size:38px;padding:34px}.form-actions{margin-top:24px}.form-actions button{width:100%;padding:14px}.profile-head{display:flex;align-items:center;gap:18px}.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);font-size:24px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:20px;border-radius:14px;background:var(--surface-2)}.stat strong{display:block;font-size:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}@media(max-width:800px){.shell{width:min(100% - 28px,1180px)}nav{align-items:flex-start;padding:18px 0}.nav-links{flex-wrap:wrap;gap:12px}.hero,.auth-layout,.challenge-layout,.grid-2,.grid-3{grid-template-columns:1fr}.hero{padding-top:20px}.feature-strip,.stats{grid-template-columns:1fr}.auth-layout{gap:20px}.auth-card{padding:24px}.site-header{position:static}}
</style></head><body><header class="site-header"><nav class="shell" aria-label="Навигация"><a class="brand" href="/"><span class="brand-mark"></span>CYBERARENA</a><div class="nav-links"><a href="/challenges">Задания</a><a href="/leaderboard">Рейтинг</a>{% if user %}{% if user.must_change_password %}<a href="/change-password">Сменить пароль</a>{% else %}<a href="/submissions">Попытки</a><a href="/profile">Профиль</a>{% if user.is_admin %}<a href="/admin">Управление</a>{% endif %}{% endif %}<form class="nav-form" action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="nav-button" type="submit">Выйти</button></form>{% else %}<a href="/login">Вход</a><a class="button" href="/register">Регистрация</a>{% endif %}</div></nav></header><main class="shell">{% block content %}{% endblock %}</main></body></html>
