
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Смена пароля | CYBERARENA</title>

    <style>
        body {
            background: #111114;
            color: #f5f5f5;
            font-family: system-ui, sans-serif;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, button {
            padding: 12px;
            border-radius: 6px;
        }

        input {
            background: #202024;
            border: 1px solid #45454c;
            color: white;
        }

        button {
            background: #a2ff85;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .error { color: #ff7777; }
    </style>
</head>

<body>
    <h1>CYBERARENA</h1>
    <h2>Смена пароля</h2>

    <p>Для продолжения необходимо изменить пароль.</p>

    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form action="/change-password" method="post">
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <label for="current_password">Текущий пароль</label>
        <input id="current_password"
               type="password"
               name="current_password"
               autocomplete="current-password"
               required>

        <label for="new_password">Новый пароль</label>
        <input id="new_password"
               type="password"
               name="new_password"
               minlength="12"
               maxlength="128"
               autocomplete="new-password"
               required>

        <label for="password_confirm">Повторите пароль</label>
        <input id="password_confirm"
               type="password"
               name="password_confirm"
               autocomplete="new-password"
               required>

        <button type="submit">Изменить пароль</button>
    </form>
</body>
</html>
