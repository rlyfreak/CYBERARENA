name: cyberarena

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build:
      context: ./backend
    image: cyberarena-app:dev
    volumes:
      - db-data:/code/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  app-net: {}

volumes:
  db-data: {}
