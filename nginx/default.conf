resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;
    absolute_redirect off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /_errors/ {
        internal;
        root /usr/share/nginx;
    }

    location = /lab {
        return 301 /lab/;
    }

    # Public challenge assets only. Never mount secrets or write-ups here.
    location = /files {
        return 301 /files/;
    }

    location ^~ /files/ {
        alias /usr/share/nginx/files/;
        index index.html;
        autoindex off;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        # HTML exercises may execute JS, but cannot use the platform's origin.
        add_header Content-Security-Policy "sandbox allow-scripts" always;
        limit_except GET { deny all; }
        location ~ (^|/)\. {
            return 404;
        }
    }

    location /lab/ {
        set $lab_upstream lab-gateway:8000;
        rewrite ^/lab/(.*)$ /$1 break;
        proxy_pass http://$lab_upstream;

        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix /lab;
        # Platform cookies never reach the lab; the lab cannot set cookies.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        proxy_intercept_errors on;
        # Preserve the upstream status: fallback may legitimately be 502, 503 or 504.
        error_page 502 503 504 /_errors/lab_down.html;
    }

    location / {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
