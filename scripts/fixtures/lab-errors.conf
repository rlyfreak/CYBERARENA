# Mounted only by compose.ctf-test.yaml. The working gateway has no fault routes.
server {
    listen 8000;
    server_name ctf-fallback-probe;
    location = /502 { return 502; }
    location = /503 { return 503; }
    location = /504 { return 504; }
    location = /echo-cookie {
        default_type text/plain;
        return 200 "cookie=[$http_cookie]";
    }
    location = /set-cookie {
        add_header Set-Cookie "cyberarena_session=lab-probe; Path=/" always;
        default_type text/plain;
        return 200 "set-cookie probe";
    }
    location / { return 404; }
}
