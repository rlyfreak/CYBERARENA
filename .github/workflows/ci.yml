name: CYBERARENA CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q backend/app

      - name: Validate PR diff whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/main...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Ruff lint
        run: python -m ruff check backend/app backend/tests scripts/ctf_smoke.py scripts/check_resource_integration.py scripts/check_static_files.py scripts/check_files_hardening.py scripts/check_lab_browser.py scripts/fixtures/lab_probe.py scripts/generate_crypto_01.py scripts/check_crypto_01_resource.py scripts/check_crypto_01_flow.py scripts/check_web_02_flow.py scripts/auth_load.py

      - name: Pytest
        env:
          PYTHONPATH: backend
          SESSION_SECRET: cyberarena-ci-test-secret-2026-strong
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: TestAdminPass123!
        run: python -m pytest backend/tests -v

  docker-ctf:
    name: CTF / Docker, persistence and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CTF_CHECK_ADMIN_PASSWORD: IsolatedCiAdminPassword2026
      CTF_CHECK_SESSION_SECRET: cyberarena-ci-isolated-compose-session-secret-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build test image
        run: docker build -f backend/Dockerfile.test -t cyberarena-ctf-tests:local .

      - name: Test Python 3.12 under resource limits
        run: |
          docker run --rm --memory 512m --cpus 1 cyberarena-ctf-tests:local python -m pytest backend/tests -q
          docker run --rm cyberarena-ctf-tests:local python -m ruff check backend/app backend/tests scripts/ctf_smoke.py scripts/check_resource_integration.py scripts/check_static_files.py scripts/check_files_hardening.py scripts/check_lab_browser.py scripts/fixtures/lab_probe.py scripts/generate_crypto_01.py scripts/check_crypto_01_resource.py scripts/check_crypto_01_flow.py scripts/check_web_02_flow.py scripts/auth_load.py
          docker run --rm cyberarena-ctf-tests:local python -m pip check
          docker run --rm --memory 512m --cpus 1 cyberarena-ctf-tests:local python backend/tests/benchmark_ctf.py

      - name: Configure WEB-01 test flag
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib
          import os

          password = os.environ["CTF_CHECK_ADMIN_PASSWORD"]
          digest = hashlib.sha256(
              (password + "WEB-01").encode()
          ).hexdigest()

          print(f"CTF_CHECK_WEB01_FLAG=CTF{{{digest}}}")
          PY

      - name: Validate production Compose without printing secrets
        env:
          ADMIN_PASSWORD: ${{ env.CTF_CHECK_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ env.CTF_CHECK_SESSION_SECRET }}
          WEB01_FLAG: ${{ env.CTF_CHECK_WEB01_FLAG }}
        run: |
          docker compose --env-file /dev/null -f compose.yaml config --quiet
          docker compose --env-file /dev/null -f compose.yaml config --format json |
            python -c 'import json, sys; c=json.load(sys.stdin); assert c["services"]["nginx"]["ports"][0]["host_ip"] == "127.0.0.1"'
          NGINX_BIND=192.0.2.10 docker compose --env-file /dev/null -f compose.yaml config --format json |
            python -c 'import json, sys; c=json.load(sys.stdin); s=c["services"]; assert s["nginx"]["ports"][0]["host_ip"] == "192.0.2.10"; assert not s["app"].get("ports"); assert not s["lab-web"].get("ports"); assert c["networks"]["lab-net"]["internal"]'

      - name: Install browser isolation checker
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Start isolated Compose stack
        run: docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check up -d --build --wait --wait-timeout 90

      - name: Verify infrastructure fixtures, HTTP flows, persistence and isolation
        env:
          CYBERARENA_SMOKE_BASE: http://127.0.0.1:18080
          WEB02_RESOURCE_PATH: /files/web-02/index.html
          WEB02_EXPECTED_MARKER: CYBERARENA-WEB02-INFRA-PROBE
          CRYPTO01_RESOURCE_PATH: /files/crypto-01/challenge.txt
          CRYPTO01_EXPECTED_MARKER: CYBERARENA-CRYPTO01-INFRA-PROBE
        run: |
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check exec -T nginx nginx -t
          python scripts/check_static_files.py --base http://127.0.0.1:18080 --root scripts/fixtures/files
          python scripts/check_files_hardening.py --base http://127.0.0.1:18080
          python scripts/check_resource_integration.py
          python scripts/ctf_smoke.py prepare
          python scripts/ctf_isolation.py
          python scripts/ctf_smoke.py upstream-errors
          python scripts/ctf_smoke.py lab-isolation
          python scripts/check_lab_browser.py
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check restart app
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check up -d --no-recreate --wait --wait-timeout 90
          python scripts/ctf_smoke.py verify

      - name: Verify real CRYPTO-01 and WEB-02 delivery, solves and persistence
        run: |
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -f compose.crypto-test.yaml -p cyberarena-ctf-check up -d --no-deps --wait nginx
          python scripts/check_static_files.py --base http://127.0.0.1:18080 --root files
          python scripts/check_crypto_01_resource.py --base http://127.0.0.1:18080
          python scripts/check_crypto_01_flow.py prepare
          python scripts/check_web_02_flow.py prepare
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -f compose.crypto-test.yaml -p cyberarena-ctf-check restart app
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -f compose.crypto-test.yaml -p cyberarena-ctf-check up -d --no-recreate --wait --wait-timeout 90
          python scripts/check_crypto_01_flow.py verify
          python scripts/check_web_02_flow.py verify
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check stop lab-web
          python scripts/ctf_smoke.py lab-down

      - name: Proxy diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check ps --all
          docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check logs --no-color --timestamps --tail 100 nginx lab-gateway

      - name: Clean up isolated stack
        if: always()
        run: docker compose --env-file /dev/null -f compose.ctf-test.yaml -p cyberarena-ctf-check down
